name: Build and regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the shipped executable
        shell: powershell
        run: .\test.ps1 -SkipBuild
      - name: Build and test
        shell: powershell
        run: .\test.ps1
